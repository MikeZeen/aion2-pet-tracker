# Builds the app and publishes a GitHub release when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package.json version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} doesn't match package.json version $version"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          npm ci
          pip install -r scripts/requirements.txt

      - name: Build
        run: npm run dist

      - name: Zip
        run: Compress-Archive -Path release/win-unpacked/* -DestinationPath aion2-pet-tracker-${{ github.ref_name }}.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: aion2-pet-tracker-${{ github.ref_name }}.zip
          generate_release_notes: true
